[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base-neural-model"
version = "0.2.0"
description = "A comprehensive neural model: dynamical activity -> tissue mechanical displacement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Daniel Umemezie" }]
dependencies = [
    "numpy>=1.26",
    # Dynamical neural-mass ODE integration (scipy.integrate) + signal processing.
    "scipy>=1.11",
    # Global Sobol sensitivity — the central in-silico test that proves the
    # verdict collapses onto eta and content-band synchrony s (source doc PART 2).
    "SALib>=1.4",
    # Real FEM cross-check of the analytical Eshelby kappa derivation.
    "scikit-fem>=8",
]

# Development / test tooling lives in a uv dependency group, not a published extra:
# it is installed by default on `uv sync` but never ships to consumers of the wheel.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Visualization tooling for the scripts/ reporting plots (e.g. the (eta, s)
# measurable-space figure). Kept out of the runtime deps so the wheel stays lean;
# install with `uv sync --group viz`.
viz = ["matplotlib>=3.8"]

[tool.uv]
# Build the editable install once; don't re-link the package on dependency-only
# changes. Safe here because the package is pure Python with no compiled step.
# (Remove if you want every `uv sync` to reinstall base_neural_model itself.)
package = true

[tool.setuptools.packages.find]
include = ["base_neural_model*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
# Surface a stale strict-xfail (a stub that started passing) as a failure, so the
# suite tells us the moment a module is implemented and its xfail should be removed.
xfail_strict = false

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
